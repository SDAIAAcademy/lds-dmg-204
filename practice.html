<section>
<h2>اليوم 1: من الحصر إلى المستوى إلى الضابط</h2>
<ol>
<li><p>في مجلد محللة في قطاع الجودة ملف CSV صدّرته من جدول نتائج الفحص في نظام المختبرات قبل شهرين، ولم يُسجل في أي مكان. كيف يدخل الحصر؟</p><ul><li><b>أ.</b> أصل جديد يصنفه القطاع وحده لأنه ملف مستقل</li><li><b>ب.</b> ليس أصلًا، لأنه ملف عمل مؤقت لمحللة</li><li><b>ج.</b> موقع للأصل نفسه، يُسجل ثم يُنقل أو يُتلف</li><li><b>د.</b> بيانات شخصية للمحللة، فلا تُحصر مع بيانات القطاع</li></ul></li>
<li><p>جدول في قطاع الجودة بنتائج الفحص الطبي الدوري لثلاثين فنيًا، بأسمائهم. كشفه يضر بكل فني ضررًا محدودًا يُتدارك. ما المستوى؟</p><ul><li><b>أ.</b> مقيد، لأن نظام حماية البيانات الشخصية يمنع الإفصاح عنها</li><li><b>ب.</b> سري، لأن البيانات الصحية بيانات حساسة في النظام</li><li><b>ج.</b> عام، لأن الأثر منخفض ومنفعة الشفافية أكبر</li><li><b>د.</b> سري للغاية، لأن الفحص الطبي يمس السلامة</li></ul></li>
<li><p>لوحة في قطاع الجودة تجمع عدد العينات المفحوصة يوميًا (عام) مع قائمة الفنيين المناوبين بأسمائهم (مقيد). لا يكشف اجتماعهما شيئًا غير ما في كل منهما. ما مستوى اللوحة؟</p><ul><li><b>أ.</b> عام، لأن أغلب ما في اللوحة أعداد منشورة</li><li><b>ب.</b> سري، لأن كل تجميع يرفع المستوى درجة</li><li><b>ج.</b> بين العام والمقيد، فتُنشر الأعداد وتُحجب الأسماء</li><li><b>د.</b> مقيد، أعلى المكوّنين، ولا أثر جديد يرفعه</li></ul></li>
<li><p>في مصفوفة قطاع الجودة، خلية «سري × التخزين» فيها ضابط واحد: «تشفير القرص الصلب لأجهزة الفنيين». ما الذي ينقصها أولًا؟</p><ul><li><b>أ.</b> الإتلاف بأحدث طرق محو الوسائط المعتمدة</li><li><b>ب.</b> مكان معتمد للسري، بقائمة وصول مسماة</li><li><b>ج.</b> تشفير أقوى للقرص نفسه</li><li><b>د.</b> علامة الحماية في رأس كل ملف فقط</li></ul></li>
<li><p>في مخزن ملفات قطاع الجودة مجلد «نسخة_2025» فيه الجدول نفسه لنتائج الفحص كما كان قبل عام. كيف يُكتب في الحصر؟</p><ul><li><b>أ.</b> أصل مستقل لأن بياناته قديمة ولم تعد تُستخدم</li><li><b>ب.</b> ليس أصلًا لأنه نسخة احتياطية لا يعمل عليها أحد</li><li><b>ج.</b> موقع لأصل نتائج الفحص، بمستواه وضوابطه</li><li><b>د.</b> أصل في القطاع التقني لأنه هو من يدير النسخ</li></ul></li>
<li><p>يستلم قطاع الجودة من مختبر معتمد في بلد المنشأ شهادات تحليل مع كل شحنة، موسومة من الجهة المرسلة بمستوى ما. ما وضعها في حصر القطاع؟</p><ul><li><b>أ.</b> داخل الحصر، بمستوى المرسل حتى يُراجع معه</li><li><b>ب.</b> خارج الحصر، لأن القطاع لم ينتجها</li><li><b>ج.</b> داخل الحصر، ويعيد القطاع تصنيفها وحده كما يرى</li><li><b>د.</b> خارج الحصر حتى يرسل المختبر سجل تصنيفه</li></ul></li>
<li><p>قيّمت مها الحديثي أثر الإفصاح عن دليل إجراءات الفحص الداخلي فوجدته منخفضًا، ولا نظام يمنع نشره، والمنفعة من نشره للمستوردين أكبر من ضرره. ما المستوى؟</p><ul><li><b>أ.</b> مقيد، لأن كل أثر منخفض يعني مقيدًا</li><li><b>ب.</b> سري، لأنه دليل داخلي</li><li><b>ج.</b> مقيد حتى يطلبه أحد من خارج الهيئة</li><li><b>د.</b> عام</li></ul></li>
<li><p>ملفات الفحوص الطبية الدورية لفنيي المختبر، كل فني في ملفه. ما المستوى الأرجح، ولماذا؟</p><ul><li><b>أ.</b> سري، لأن البيانات الصحية من البيانات الحساسة في النظام</li><li><b>ب.</b> مقيد: الأثر على كل فرد محدود، وإن كانت البيانات حساسة</li><li><b>ج.</b> عام بعد حذف الأسماء من كل ملف</li><li><b>د.</b> سري للغاية، لأن الإفصاح يمس الصحة</li></ul></li>
<li><p>أصل في قطاع الجودة لم يُصنف بعد، وطلبه زميل من إدارة أخرى. يُعامل حتى يُصنف معاملة المقيد.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>صنّف مراجعان عشرة أصول في قطاع الجودة واتفقا في ثمانية. ومراجع ثالث يقول «مقيد» لكل شيء اتفق مع الثاني في ستة. ماذا تقول نسبة الاتفاق الخام هنا؟</p><ul><li><b>أ.</b> الثالث جيد بما يكفي، فنسبته 60%</li><li><b>ب.</b> الاتفاق العالي يعني أن المستويات صحيحة</li><li><b>ج.</b> تخفي أثر الصدفة؛ كابا للثالث صفر</li><li><b>د.</b> الاتفاق الخام وكابا يقولان الشيء نفسه دائمًا</li></ul></li>
<li><p>يجمع قطاع الجودة نتائج فحص العينات (مقيد) مع مواقع الخزنة التي تُحفظ فيها العينات المرجعية (سري) في لوحة واحدة. ما الحد الأدنى لمستوى اللوحة؟</p><ul><li><b>أ.</b> مقيد، لأن أغلب اللوحة نتائج فحص</li><li><b>ب.</b> سري</li><li><b>ج.</b> سري للغاية، لأن كل تجميع يرفع درجة</li><li><b>د.</b> مقيد، ويُخفى عمود المواقع عن أغلب المستخدمين</li></ul></li>
<li><p>محللة في قطاع الجودة تريد مشاركة جدول نتائج مقيد مع زميل في الهيئة نفسها عبر رابط في منصة سحابية تجارية لأن البريد يرفض حجمه. ما الرد؟</p><ul><li><b>أ.</b> مقبول إن كان الرابط محميًا بكلمة مرور</li><li><b>ب.</b> مقبول لأن الزميل داخل الهيئة</li><li><b>ج.</b> مقبول إن حُذف الرابط بعد يوم</li><li><b>د.</b> غير مقبول: المنصة معتمدة للعام فقط</li></ul></li>
<li><p>في مصفوفة التعامل، سطر «سري» في مرحلة الإتلاف فيه: «حذف الملف وإفراغ سلة المحذوفات». ما الذي ينقصه؟</p><ul><li><b>أ.</b> لا شيء، فالحذف النهائي إتلاف</li><li><b>ب.</b> إتلاف معتمد بمحو الوسائط، ويُسجل</li><li><b>ج.</b> نقل الملف إلى الأرشيف الإلكتروني بدل حذفه</li><li><b>د.</b> علامة «سري» على الملف قبل حذفه</li></ul></li>
<li><p>يقترح فريق التقنية في قطاع الجودة ضابطًا واحدًا لكل الأسطر في مرحلة التخزين: «تشفير قرص الأجهزة». ما المشكلة؟</p><ul><li><b>أ.</b> التشفير لا يحدد مكان الحفظ ولا من يصل</li><li><b>ب.</b> التشفير غير مسموح في الجهات الحكومية</li><li><b>ج.</b> التشفير يلزم للعام فقط</li><li><b>د.</b> لا مشكلة، فالتشفير يحمي البيانات في كل مستوى ولكل مرحلة</li></ul></li>
<li><p>يريد قطاع الجودة نشر عدد العينات المرفوضة لكل مستورد شهريًا على بوابة البيانات المفتوحة. أي مرحلة من المصفوفة تحكم القرار أولًا؟</p><ul><li><b>أ.</b> الاحتفاظ، لأن البيانات شهرية</li><li><b>ب.</b> الأرشفة، لأن النشر حفظ طويل</li><li><b>ج.</b> التقييم: هل الجدول عام أصلًا؟ ثم المشاركة</li><li><b>د.</b> الإتلاف، لأن البوابة تستبدل كل شهر جدول الشهر السابق</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: السجل والآلة</h2>
<ol>
<li><p>تريد مها الحديثي، ممثلة بيانات الأعمال في قطاع الجودة، أن ترسل نتائج فحص عينات الأرز لهذا الشهر، وهي مقيدة (ب)، إلى مختبر جامعي يساعد في دراسة. ما الذي يُطلب قبل الإرسال؟</p><ul><li><b>أ.</b> خفض الملف إلى عام لأن الجامعة جهة موثوقة</li><li><b>ب.</b> رابط مشاركة في المنصة السحابية ينتهي بعد أسبوع</li><li><b>ج.</b> علامة «مقيد» في رأس الملف وتذييله فقط</li><li><b>د.</b> اتفاقية مشاركة تسمي الغرض والمستلم، ونقل مشفر</li></ul></li>
<li><p>أربعة مدخلات في سجل قطاع الجودة، صُنفت كلها في 2026-10-05. أيها يرده المراجِع؟</p><ul><li><b>أ.</b> سجل المعايرة: صنّفته مها الحديثي وراجعته بنفسها</li><li><b>ب.</b> نتائج الفحص: راجعتها لينا الفرج في 2026-11-02</li><li><b>ج.</b> دليل الفحص المنشور: عام، بلا محفز</li><li><b>د.</b> مسودة المواصفة: مقيد، يُرفع تصنيفها يوم النشر المتوقع 2027-03-01</li></ul></li>
<li><p>بعد تجربة ثانية في قطاع الجودة على 400 عنصر، يقترح المورد توسيع مِيسَم إلى القطاعات كلها لأن «التطابق التام ارتفع إلى 91%». ما الذي تطلبه قبل الموافقة؟</p><ul><li><b>أ.</b> التطابق التام نفسه على عينة إنجليزية</li><li><b>ب.</b> الإنذار الكاذب في العام وحده، لأنه يملأ المراجعة</li><li><b>ج.</b> الإغفال في السري والسري للغاية</li><li><b>د.</b> عينة أكبر بالمقياس نفسه، ألف عنصر مثلًا</li></ul></li>
<li><p>صُنف أصل في الأول من سبتمبر 2026، وراجعه مكتب إدارة البيانات في العشرين من أكتوبر 2026. ما المشكلة في السجل؟</p><ul><li><b>أ.</b> المراجعة جاءت بعد أكثر من شهر من التصنيف</li><li><b>ب.</b> لا مشكلة، فالمهم أن المراجعة وقعت</li><li><b>ج.</b> المراجعة يجب أن تسبق التصنيف</li><li><b>د.</b> يجب أن يراجع ممثل بيانات الأعمال لا مكتب إدارة البيانات</li></ul></li>
<li><p>خطة التفتيش السنوية في قطاع الجودة مقيدة. أي محفز لرفع تصنيفها يصلح للسجل؟</p><ul><li><b>أ.</b> عند الحاجة</li><li><b>ب.</b> حين يطلبها أحد من خارج الهيئة</li><li><b>ج.</b> يقرره المراجِع لاحقًا</li><li><b>د.</b> تاريخ محدد: مراجعة في نهاية سنة الخطة، بتاريخها</li></ul></li>
<li><p>أصل سري في قطاع الجودة محفوظ في مخزن ملفات معتمد حتى المقيد، ولا مكان معتمدًا للسري قبل شهرين. ما الذي يُكتب في السجل؟</p><ul><li><b>أ.</b> خفض المستوى إلى مقيد حتى يُنقل</li><li><b>ب.</b> استثناء بضابط تعويضي وتاريخ انتهاء ومعتمِد مستقل عن المالك</li><li><b>ج.</b> لا شيء حتى يُنقل</li><li><b>د.</b> استثناء دائم، لأن النقل يحتاج نظامًا جديدًا لا موعد له</li></ul></li>
<li><p>قاعدة شكاوى يغذيها قطاعان، ولا يقبل أحدهما ملكيتها. ما المستوى المؤقت في مذكرة التصعيد؟</p><ul><li><b>أ.</b> عام حتى يُعيَّن مالك</li><li><b>ب.</b> مستوى القطاع الذي أدخل أكثر السجلات، لأنه المساهم الأكبر</li><li><b>ج.</b> الأعلى بين ما يقترحه القطاعان، حتى القرار</li><li><b>د.</b> بلا مستوى حتى يُحسم النزاع</li></ul></li>
<li><p>فني في قطاع الجودة يرى أن جدولًا صُنف خطأً سريًا. يكفي أن يعدّل المستوى في السجل بنفسه ويكتب سببه.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في تجربة على خمسين عنصرًا من قطاع الجودة، ستة عناصر مرجعها سري، ووسمت الآلة ثلاثة منها مقيدة. ما معدل الإغفال في السري؟</p><ul><li><b>أ.</b> 6%، لأن ثلاثة من خمسين</li><li><b>ب.</b> 50%، ثلاثة من العناصر الستة</li><li><b>ج.</b> صفر، لأن المقيد ليس عامًا</li><li><b>د.</b> لا يُحسب إلا على عمود ما قالته الآلة</li></ul></li>
<li><p>قاعدة في مسار الوسم الآلي تبحث عن الجوال بنمط لا يقبل إلا الخانات الغربية من 0 إلى 9، عشر خانات متتالية. نصوص قطاع الجودة العربية تكتب الأرقام بالخانات العربية الهندية. ما المتوقع؟</p><ul><li><b>أ.</b> تطابقها، فالرقم رقم</li><li><b>ب.</b> تطابقها إن كُتبت بلا مسافات</li><li><b>ج.</b> لا تطابقها، فتصل العناصر إلى المرحلة التالية</li><li><b>د.</b> لا تطابقها، والحل حذف القاعدة والاعتماد على النموذج</li></ul></li>
<li><p>يريد فني أن يعرف مستوى تقرير فحص لم يُصنف، فيلصقه في مساعد ذكاء اصطناعي توليدي عام ويسأله. ما الحكم؟</p><ul><li><b>أ.</b> مسموح لأن التقرير لم يُصنف بعد، فلا مستوى يمنع إدخاله</li><li><b>ب.</b> مسموح إن حُذفت الأسماء</li><li><b>ج.</b> مسموح للسؤال عن المستوى فقط</li><li><b>د.</b> غير مسموح: ما لم يُصنف لا يدخل أداة توليدية</li></ul></li>
<li><p>كتب قطاع الجودة قواعد توجيه آخرها: «كل ما بقي: مراجعة بشرية». النتيجة: 95% من العناصر إلى المراجعين. ما المشكلة؟</p><ul><li><b>أ.</b> لا مشكلة، فالمراجعة البشرية أأمن دائمًا</li><li><b>ب.</b> حمل كهذا يجعل المراجعة موافقة آلية</li><li><b>ج.</b> القاعدة الأخيرة يجب ألا تكون شاملة</li><li><b>د.</b> المراجعة البشرية لا تلزم للسري</li></ul></li>
<li><p>ما الذي يحفظه سجل التدقيق لكل عنصر وسمه المسار آليًا ثم قُبل؟</p><ul><li><b>أ.</b> المستوى النهائي فقط</li><li><b>ب.</b> اسم المورد الذي باع النموذج</li><li><b>ج.</b> نص العنصر كاملًا لإعادة التدريب</li><li><b>د.</b> المرحلة التي قررت، وقاعدة التوجيه، والمعتمِد وتاريخه</li></ul></li>
</ol>
